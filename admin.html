<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Bhutta Hotel</title><link rel="stylesheet" href="/styles.css"><style>body{background:#f5f1e8}.admin{max-width:1100px;margin:50px auto;padding:25px}.panel{background:white;padding:25px;margin:20px 0;overflow:auto}.admin input,.admin select{max-width:100%}.admin table{width:100%;border-collapse:collapse;font-size:12px}.admin td,.admin th{padding:12px;border-bottom:1px solid #eee;text-align:left}.admin button{padding:8px 12px;background:#173a2c;color:white;border:0;cursor:pointer;margin:3px}.hidden{display:none}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:700px){.admin-grid{grid-template-columns:1fr}.admin{margin:10px;padding:10px}}</style></head><body><div class="admin"><a href="/" class="text-link">← Back to website</a><h1 style="font:40px 'Playfair Display';color:#102c22">Bhutta Admin</h1><p>Manage menu, rooms, orders and reservations.</p><section class="panel" id="loginPanel"><h2>Admin sign in</h2><form id="login"><label>Username<input name="username" required></label><label>Password<input name="password" type="password" required></label><button>Sign in</button><p id="loginMsg"></p></form></section><section id="dashboard" class="hidden"><button id="logout">Sign out</button><div class="admin-grid"><section class="panel"><h2>Add menu item</h2><form id="menuForm"><label>Name<input name="name" required></label><label>Category<input name="category" required placeholder="Traditional / BBQ / Drinks"></label><label>Description<input name="description"></label><label>Price (PKR)<input name="price" type="number" min="0" required></label><label>Image URL<input name="image"></label><button>Add item</button></form></section><section class="panel"><h2>Add room</h2><form id="roomForm"><label>Room name<input name="name" required></label><label>Description<input name="description"></label><label>Price per night (PKR)<input name="price" type="number" min="0" required></label><label>Capacity<input name="capacity" type="number" value="2"></label><label>Image URL<input name="image"></label><button>Add room</button></form></section></div><section class="panel"><h2>Menu items</h2><div id="menuAdmin"></div></section><section class="panel"><h2>Rooms</h2><div id="roomsAdmin"></div></section><section class="panel"><h2>Orders</h2><div id="ordersAdmin"></div></section><section class="panel"><h2>Reservations</h2><div id="bookingsAdmin"></div></section></section></div><script src="/admin.js"></script></body></html>
